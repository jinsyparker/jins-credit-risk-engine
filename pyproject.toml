[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-risk-engine"
version = "0.1.0"
description = "Credit risk modeling, validation, LGD/EAD estimation, and expected-loss analytics."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24,<3",
    "pandas>=2.0,<3",
    "scikit-learn>=1.3,<2",
    "pyarrow>=14,<22",
    "plotly>=5.18,<7",
    "streamlit>=1.30,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "jupyter>=1,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
